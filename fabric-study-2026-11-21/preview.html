<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fabric study</title><link rel="stylesheet" href="style.css"><style>html,body{height:100%;overflow:hidden}body{display:flex;flex-direction:column;margin:0;background:#dedbd5;font:16px system-ui}header{padding:12px;display:flex;gap:20px;align-items:center}main{flex:1;min-height:0;height:auto!important}header{flex-shrink:0;flex-wrap:wrap}#carrd-app-root.tshirt-hero-bg{height:100%;aspect-ratio:auto;max-height:none}</style><header><strong>Fabric study</strong><label>Fabric <select id="fabric"><option>combed-cotton</option><option>ringspun-cotton</option><option>organic-cotton</option><option>heavyweight-jersey</option><option>compact-jersey</option><option>mercerized-cotton</option><option>washed-cotton</option><option>fine-interlock</option><option>soft-cotton-blend</option><option>dry-jersey</option></select></label><a href="technical-breakdown.html">Technical breakdown</a><span>Click shirt to flip</span></header><main><div id="carrd-app-root" class="tshirt-hero-bg" data-fabric="combed-cotton" data-glb-url="../tshirt.glb"><div class="tshirt-squircle-frame"><div id="tshirt-canvas-stage" class="tshirt-canvas-stage" tabindex="0" role="button" aria-label="Flip shirt"></div></div></div></main><script>document.getElementById('fabric').onchange=e=>document.getElementById('carrd-app-root').dataset.fabric=e.target.value;</script><script src="script.js"></script></html>
