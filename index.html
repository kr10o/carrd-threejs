<div
  id="carrd-app-root"
  class="tshirt-hero-bg"
  data-state="loading"
  data-glb-url="https://cdn.jsdelivr.net/gh/kr10o/carrd-threejs@main/tshirt.glb"
  data-logo-front="https://cdn.jsdelivr.net/gh/kr10o/carrd-threejs@main/logo-front.png"
  data-logo-front-scale="0.34"
  data-logo-front-x="0.42"
  data-logo-front-y="0.46"
  data-logo-back="https://cdn.jsdelivr.net/gh/kr10o/carrd-threejs@main/logo-back.png"
  data-logo-back-scale="1.18"
  data-logo-back-x="0.0"
  data-logo-back-y="0.18"
>
  <div class="tshirt-squircle-frame">
    <div
      id="tshirt-canvas-stage"
      class="tshirt-canvas-stage"
      role="button"
      tabindex="0"
      aria-label="Click to rotate T-shirt 180 degrees between front and back print"
      title="Click to rotate T-Shirt (Front / Back)"
    ></div>
  </div>
</div>

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
<link rel="preconnect" href="https://www.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/kr10o/carrd-threejs@main/style.css" crossorigin="anonymous" />

<script>
(function () {
  'use strict';

  function loadScript(src) {
    if (document.querySelector('script[src="' + src + '"]')) return;
    const s = document.createElement('script');
    s.src = src;
    s.async = true;
    s.crossOrigin = 'anonymous';
    document.head.appendChild(s);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () {
      loadScript('https://cdn.jsdelivr.net/gh/kr10o/carrd-threejs@main/script.js');
    });
  } else {
    loadScript('https://cdn.jsdelivr.net/gh/kr10o/carrd-threejs@main/script.js');
  }
})();
</script>
