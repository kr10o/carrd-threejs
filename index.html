<div id="carrd-app-root" class="manga-halftone-hero-bg" data-state="loading" aria-hidden="true">
  <div id="halftone-squircle-frame" class="halftone-squircle-frame">
    <div id="halftone-canvas-stage" class="halftone-canvas-stage"></div>
  </div>
</div>

<!-- External Stylesheet via jsDelivr GitHub CDN -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/kr10o/carrd-threejs@main/style.css" crossorigin="anonymous" />

<script>
(function () {
  'use strict';

  function loadCdnScript(url) {
    return new Promise((resolve, reject) => {
      if (document.querySelector(`script[src="${url}"]`)) return resolve();
      const script = document.createElement('script');
      script.src = url;
      script.async = true;
      script.crossOrigin = 'anonymous';
      script.onload = () => resolve();
      script.onerror = () => reject(new Error(`Failed to load script: ${url}`));
      document.head.appendChild(script);
    });
  }

  function loadCdnStyle(url) {
    if (document.querySelector(`link[href="${url}"]`)) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = url;
    link.crossOrigin = 'anonymous';
    document.head.appendChild(link);
  }

  async function bootMangaHeroBackground() {
    loadCdnStyle('https://cdn.jsdelivr.net/gh/kr10o/carrd-threejs@main/style.css');
    await loadCdnScript('https://cdn.jsdelivr.net/gh/kr10o/carrd-threejs@main/script.js');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bootMangaHeroBackground);
  } else {
    bootMangaHeroBackground();
  }
})();
</script>
